<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Divya 💖</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff5f9e, #ff8ccf);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .card {
    background: white;
    width: 90%;
    max-width: 350px;
    padding: 30px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    animation: pop 0.8s ease;
    position: relative;
    z-index: 2;
  }

  @keyframes pop {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  h1 {
    color: #ff2f92;
    margin-bottom: 15px;
  }

  p {
    color: #555;
    font-size: 16px;
  }

  .buttons {
    margin-top: 25px;
    height: 60px;
  }

  button {
    padding: 14px 28px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
  }

  #yes {
    background: #28c76f;
    color: white;
  }

  /* NO button is now FREE to move */
  #no {
    background: #ff4d6d;
    color: white;
    position: fixed;   /* 🔥 KEY FIX */
    top: 60%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
  }

  .heart {
    position: fixed;
    bottom: -20px;
    font-size: 20px;
    animation: floatUp 6s linear infinite;
    opacity: 0.7;
    z-index: 1;
  }

  @keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-100vh); opacity: 0; }
  }
</style>
</head>

<body>

<div class="card">
  <h1>Hey Divya 💕</h1>
  <p><b>Will you be my Valentine? 💘</b></p>

  <div class="buttons">
    <button id="yes" onclick="yesClicked()">Yes 💖</button>
  </div>
</div>

<button id="no">No 💔</button>

<script>
  const noBtn = document.getElementById("no");

  function moveNo() {
    const padding = 20;
    const btnWidth = noBtn.offsetWidth;
    const btnHeight = noBtn.offsetHeight;

    const maxX = window.innerWidth - btnWidth - padding;
    const maxY = window.innerHeight - btnHeight - padding;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  }

  // Runs away on ALL interactions
  noBtn.addEventListener("mouseenter", moveNo);
  noBtn.addEventListener("touchstart", moveNo);
  noBtn.addEventListener("click", moveNo);

  function yesClicked() {
    document.body.innerHTML = `
      <div class="card">
        <h1>Ohhhh 😍💞</h1>
        <p><b>You are my Valentine madam 💖</b></p>
        <p>Mission successful 😌🌹</p>
      </div>
    `;
  }

  // Floating hearts
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (4 + Math.random() * 3) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
  }, 500);
</script>

</body>
</html>
